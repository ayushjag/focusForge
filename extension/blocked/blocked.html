<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay focused | FocusForge</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="brand-mark" aria-hidden="true">F</div>
      <p class="eyebrow">FocusForge</p>
      <h1>This site is blocked during your focus session.</h1>
      <p class="message">
        Your session is active. Complete or cancel it in FocusForge before returning to this site.
      </p>

      <div class="session-status">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Focus session active</span>
      </div>

      <button id="back-button" type="button">Go back</button>
    </main>

    <script type="module" src="blocked.js"></script>
  </body>
</html>
