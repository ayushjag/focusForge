services:
  postgres:
    image: postgres:16-alpine
    container_name: focusforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: focusforge
      POSTGRES_PASSWORD: focusforge_dev_password
      POSTGRES_DB: focusforge
    ports:
      - "5432:5432"
    volumes:
      - focusforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusforge -d focusforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  focusforge_postgres_data:
